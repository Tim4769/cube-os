[env:cubeos-reva]
platform = espressif32
board = rymcu-esp32-s3-devkitc-1
framework = arduino

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  adafruit/Adafruit LSM6DS
  adafruit/Adafruit BusIO
  adafruit/Adafruit Unified Sensor

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
